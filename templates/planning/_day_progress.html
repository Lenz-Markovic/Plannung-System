{# "3 von 6 gemeldet" bar (✓, ◐ or ✗); also sent "out of band" after every report. #}
<div id="day-progress" class="day-progress" {% if oob_progress %}hx-swap-oob="true"{% endif %}>
  <div class="d-flex justify-content-between"><b>{{ progress.done }} von {{ progress.total }} gemeldet</b>{% if progress.open_results %} <span class="na small">· {{ progress.open_results }} mit Nachtermin</span>{% endif %}<span class="na">{{ progress.percent }} %</span></div>
  <div class="bar" role="progressbar" aria-valuenow="{{ progress.percent }}" aria-valuemin="0" aria-valuemax="100"><span style="width:{{ progress.percent }}%"></span></div>
</div>
